name: CI Build & Test

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish_build_scan:
        description: 'Publish Gradle Build Scan to scans.gradle.com'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Verify APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: ${{ inputs.publish_build_scan == true }}
          build-scan-terms-of-use-url: ${{ inputs.publish_build_scan == true && 'https://gradle.com/terms-of-service' || '' }}
          build-scan-terms-of-use-agree: ${{ inputs.publish_build_scan == true && 'yes' || '' }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Compile, Lint and Test
        run: ./gradlew assembleRelease testDebugUnitTest lintDebug --stacktrace
