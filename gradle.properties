# Enable AndroidX support across all modules
android.useAndroidX=true

# All project dependencies are AndroidX / pure JVM; skip Jetifier bytecode transforms
android.enableJetifier=false

# Use non-transitive R classes per module for faster resource compilation
android.nonTransitiveRClass=true

# Tune Gradle JVM heap & GC for parallel Kotlin + R8 + Lint execution
org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Kotlin code style
kotlin.code.style=official

# Enable parallel execution & Gradle Build Cache
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.caching=true
